<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Sharpness Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }
        #canvas {
            border: 2px solid #333;
            border-radius: 8px;
            max-width: 100%;
            background: #000;
        }
    </style>
</head>
<body>
    <h2>Camera Image Sharpness Measure V3</h2>
    <div class="controls">
        <label for="cameraSelect">Choose Camera: </label>
        <select id="cameraSelect">
            <option value="">-- Select a camera --</option>
        </select>
        <button id="startBtn">Start Stream</button>
    </div>

    <div>
        <!-- We will draw the video and bounding box onto this hidden canvas -->
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const cameraSelect = document.getElementById('cameraSelect');
        const startBtn = document.getElementById('startBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let currentStream = null;
        let animationFrameId = null;
        
        // Populates the dropdown with available cameras safely
        async function getCameras() {
            let initialStream = null;
            try {
                // 1. Request temporary access to uncover real device labels
                initialStream = await navigator.mediaDevices.getUserMedia({ video: true });
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = '<option value="">-- Select a camera --</option>';
                videoDevices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Camera ${cameraSelect.length + 1}`;
                    cameraSelect.appendChild(option);
                });
            } catch (err) {
                console.error("Error enumerating devices:", err);
                alert("Camera access denied or blocked. Please ensure you are serving this page via http://localhost or https://");
            } finally {
                // FIX: Always explicitly close the initial permission stream to free up the hardware
                if (initialStream) {
                    initialStream.getTracks().forEach(track => track.stop());
                }
            }
        }
        
        // Starts the selected camera at maximum resolution
        async function startCamera() {
            // Stop any active canvas rendering loop
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        
            // Explicitly shut down existing streams to free up system hardware
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        
            const deviceId = cameraSelect.value;
            if (!deviceId) return alert("Please select a camera first.");
        
            // Constraint configuration optimized to hunt for max device resolution
            const constraints = {
                video: {
                    deviceId: { exact: deviceId },
                    width: { ideal: 3840 }, 
                    height: { ideal: 2160 },
                    advanced: [{ zoom: 2 }] 
                }
            };
        
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const video = document.createElement('video');
                video.setAttribute('playsinline', ''); 
                video.muted = true;                   
                video.autoplay = true;                
                video.srcObject = currentStream;
        
                video.onplaying = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    processFrame(video);
                };
                
                await video.play();
        
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Failed to open camera. Ensure the camera isn't actively being used by another application or tab.");
            }
        }
        
        // Processes each frame: draws video, box, and computes sharpness
        function processFrame(video) {
            if (!currentStream || video.paused || video.ended) return;
        
            // 1. Draw current video frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
            // 2. Define rectangle dimensions (200x200 at center)
            const rectSize = 200;
            const xCenter = (canvas.width / 2) - (rectSize / 2);
            const yCenter = (canvas.height / 2) - (rectSize / 2);
        
            // 3. Extract the image data of the center rectangle
            const imgData = ctx.getImageData(xCenter, yCenter, rectSize, rectSize);
        
            // 4. Compute sharpness using Sobel Gradient Method
            const sharpness = computeSharpness(imgData);
        
            // 5. Draw the rectangle on top of the video
            ctx.strokeStyle = '#00FF00'; 
            ctx.lineWidth = 4;
            ctx.strokeRect(xCenter, yCenter, rectSize, rectSize);
        
            // 6. Draw the sharpness text below the rectangle
            ctx.fillStyle = '#00FF00';
            ctx.font = '72px Arial';
            ctx.fillText(`Sharpness: ${sharpness.toFixed(2)}`, xCenter - 300, yCenter + rectSize + 80);
        
            // Loop the frame processing
            animationFrameId = requestAnimationFrame(() => processFrame(video));
        }
        
        // Sobel-based image gradient sharpness estimation
        function computeSharpness(imgData) {
            const data = imgData.data;
            const width = imgData.width;
            const height = imgData.height;
        
            const Gx = [
                [-1, 0, 1],
                [-2, 0, 2],
                [-1, 0, 1]
            ];
            const Gy = [
                [-1, -2, -1],
                [ 0,  0,  0],
                [ 1,  2,  1]
            ];
        
            let sumGradient = 0;
        
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    let pixelX = 0;
                    let pixelY = 0;
        
                    for (let a = 0; a < 3; a++) {
                        for (let b = 0; b < 3; b++) {
                            const pixelIndex = ((y + a - 1) * width + (x + b - 1)) * 4;
                            const r = data[pixelIndex];
                            const g = data[pixelIndex + 1];
                            const b_color = data[pixelIndex + 2];
                            const gray = r * 0.299 + g * 0.587 + b_color * 0.114;
        
                            pixelX += gray * Gx[a][b];
                            pixelY += gray * Gy[a][b];
                        }
                    }
        
                    const magnitude = Math.sqrt(pixelX * pixelX + pixelY * pixelY);
                    sumGradient += magnitude;
                }
            }
        
            const totalPixels = (width - 2) * (height - 2);
            return sumGradient / totalPixels;
        }
        
        // Event listeners
        startBtn.addEventListener('click', startCamera);
        navigator.mediaDevices.addEventListener('devicechange', getCameras);
        
        // Initialize camera list on page load
        getCameras();

    </script>
</body>
</html>
