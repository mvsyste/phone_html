<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Exposure Control</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
  }
  video {
    width: 100%;
    max-width: 500px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .controls {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 500px;
  }
  .slider-group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-top: 0.5rem;
  }
  input[type=range] {
    flex-grow: 1;
    margin: 0 1rem;
  }
  #unsupported-msg {
    color: red;
    display: none;
  }
</style>
</head>
<body>

  <video id="stream" autoplay playsinline></video>
  
  <div class="controls">
    <p id="unsupported-msg">Exposure time is not supported by this camera.</p>
    
    <div class="slider-group">
      <label for="exposure">Exposure Time (ms): </label>
      <input type="range" id="exposure" disabled>
      <span id="exposure-value">0</span>
    </div>
  </div>
  <div class="stats-box">
      <h3>Exposure Properties</h3>
      <div><strong>Current:</strong> <span id="currVal">Not started</span></div>
      <div><strong>Min:</strong> <span id="minVal">-</span></div>
      <div><strong>Max:</strong> <span id="maxVal">-</span></div>
      <div><strong>Step:</strong> <span id="stepVal">-</span></div>
 </div>

  <script>
    const videoElement = document.getElementById('stream');
    const exposureSlider = document.getElementById('exposure');
    const exposureValue = document.getElementById('exposure-value');
    const unsupportedMsg = document.getElementById('unsupported-msg');

    const currVal = document.getElementById('currVal');
    const minVal = document.getElementById('minVal');
    const maxVal = document.getElementById('maxVal');
    const stepVal = document.getElementById('stepVal');
    
    let videoTrack = null;

    async function startCamera() {
      try {
        // Request the rear/environment camera
        const constraints = { 
          video: { facingMode: { ideal: "environment"  } } 
        };
        
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = stream;
        
        // Get the video track to check capabilities
        videoTrack = stream.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        
        // Check if exposureTime is supported
        if (capabilities.exposureTime) {
          const min = capabilities.exposureTime.min;
          const max = capabilities.exposureTime.max;
          const step = capabilities.exposureTime.step || 1;
          const current = videoTrack.getSettings().exposureTime || min;

          minVal.textContent = capabilities.exposureTime.min;
          maxVal.textContent = capabilities.exposureTime.max;
          stepVal.textContent = capabilities.exposureTime.step;
          currVal.textContent = videoTrack.getSettings().exposureTime || "Auto / Unset";
          
          // Configure and enable slider
          exposureSlider.min = min;
          exposureSlider.max = max;
          exposureSlider.step = step;
          exposureSlider.value = current;
          exposureValue.textContent = current;
          exposureSlider.disabled = false;
        } else {
          unsupportedMsg.style.display = 'block';
        }
      } catch (err) {
        console.error("Error accessing camera: ", err);
        alert("Please ensure you are on a mobile device with a rear camera and have granted permissions.");
      }
    }

    // Listen for slider changes
    exposureSlider.addEventListener('input', async (e) => {
      const val = parseFloat(e.target.value);
      exposureValue.textContent = val;
      currVal.textContent = val;
      
      if (videoTrack) {
        try {
          await videoTrack.applyConstraints({
            advanced: [{ exposureTime: val }]
          });
        } catch (err) {
          console.error("Error applying exposure time constraint: ", err);
        }
      }
    });

    // Initialize camera on load
    startCamera();
  </script>
</body>
</html>
