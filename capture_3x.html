<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Images Experiments</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    
    /* A neat layout wrapper for your UI */
    .video-box {
      position: relative;
      overflow: hidden; /* This hides anything outside the box! */
      border: 4px solid #fff;
      margin: 10px;
    }
    
    /* 📱 View 1: Shows the entire frame naturally */
    .regular-view {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 16 / 9;
    }
    #videoFull {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Fits perfectly inside the box */
    }
    
    .crop-view {
      width: 500px;
      height: 500px;
      max-width: 500px;
    }
    #video {
      position: absolute;
      width: 2000px;
      height: 2000px;
      top: -750px;  /* (2000 - 500) / 2 = 750px to center it vertically */
      left: -750px; /* (2000 - 500) / 2 = 750px to center it horizontally */
    }
   
    /* Draws a 1000x1000 area at the center of the viewport */
    #overlay-rect {
      position: absolute;
      top: 125px; /* (500 - 250) / 2 */
      left: 125px;
      width: 250px; /* Scaled down 1000x1000 */
      height: 250px;
      border: 3px dashed #ff0055;
      box-sizing: border-box;
      pointer-events: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h4>Save Images Exp. 3</h4>
  <!-- Container 1: The full picture -->
  <div class="video-box regular-view">
    <video id="videoFull" autoplay playsinline muted></video>
  </div>
  <!-- Container 2: The crop picture -->
  <div class="video-box crop-view">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-rect"></div>
  </div>

  <br>
  <button id="capture-btn">Save 1000x1000 Area</button>
  <br>
  <div id="mvlog">Log:</div>
  
  <script>
    document.getElementById("mvlog").textContent += ` starting javascript...`;
    const video = document.getElementById('video');
    const videoFull = document.getElementById('videoFull');
    const captureBtn = document.getElementById('capture-btn');
    // 1. Declare two external variables to store the size globally
    let streamWidth = 0;
    let streamHeight = 0;
    // Initialize a global counter at the top of your script
    let imageCounter = 1;
    
    // Start the camera with specific constraints
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "environment" }, // Ask for back camera
            width: { ideal: 4000 },                 // Ask for highest resolution
            height: { ideal: 4000 }
          }
        });

        video.srcObject = stream;
        videoFull.srcObject = stream;
        
        // Wait for video metadata to load to access tracks
        video.onloadedmetadata = () =>  {
          const track = stream.getVideoTracks()[0];
          
          // Apply 2x zoom
          if (track.getCapabilities && track.getCapabilities().zoom) {
            const minZoom = track.getCapabilities().zoom.min;
            const maxZoom = track.getCapabilities().zoom.max;
            const targetZoom = Math.min(2, maxZoom); // 2x or capped at max
            document.getElementById("mvlog").textContent += `zoom: ${targetZoom} ,maxZoom=${maxZoom}\n`;
            
            track.applyConstraints({
              advanced: [{ zoom: targetZoom }]
            }).catch(err => console.error("Zoom failed:", err));
          }

          // Get the stream size and save it to the external variables
          const settings = track.getSettings();
          streamWidth = settings.width || video.videoWidth;
          streamHeight = settings.height || video.videoHeight;
          document.getElementById("mvlog").textContent += `VideoStream: ${streamWidth}x${streamHeight}\n`;
          
          // Dynamically update the #video element's width and height
          let videoW = Math.min(2000, streamWidth);
          let videoH = Math.min(2000, streamHeight);
          video.style.width = videoW + 'px';
          video.style.height = videoH + 'px';
          let offsetX = 0; // -(streamWidth - videoW)/2;
          let offsety = 0; // -(streamHeight - videoH)/2;
          video.style.top = offsety + 'px'; 
          video.style.left = offsetX + 'px'; 
          document.getElementById("mvlog").textContent += `Crop window, offset: ${videoW}x${videoH}, ${offsetX}x${offsety}\n`;
        };

      } catch (err) {
        console.error("Error accessing camera. Please ensure you are on HTTPS and granted permission.", err);
        alert("Camera not found or permission denied. Note: Desktop emulators or local files sometimes block exact rear-facing mode. Try on mobile.");
      }
    }

    // Capture the 1000x1000 area and download as PNG
    captureBtn.addEventListener('click', () => {
      
      const canvas = document.createElement('canvas');
     
      // Get the actual width and height of the video source
      const actualWidth = streamWidth ;// video.videoWidth;
      const actualHeight = streamHeight; //video.videoHeight;
      document.getElementById("mvlog").textContent += `streamWidth x streamHeight: ${streamWidth}x${streamHeight}\n`; 
      
      // Target area: 1000x1000
      canvas.width = 1000;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');

      // The Video element is actualWidth x actualHeight px, offset in a 500x500 viewport
      // The 1000x1000 central rectangle on the video corresponds exactly to this area:
      let sx =  (actualWidth-1000)/2;
      let sy =  (actualHeight-1000)/2;
      ctx.drawImage(
        video,
        sx, sy,               // Source X, Y (starts in the center of the 2000px video)
        1000, 1000,             // Source width, height
        0, 0,                   // Destination X, Y
        1000, 1000              // Destination width, height
      );
      document.getElementById("mvlog").textContent += `video cropped  sx,sy: ${sx},${sy}\n`; 
      
      // Convert canvas to PNG and trigger download
      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataUrl;
      //link.download = `cropped-capture-${imageCounter}.png`; 
      link.download = `cropped-capture-${String(imageCounter).padStart(3, '0')}.png`;
      link.click();
      document.getElementById("mvlog").textContent += `saved: cropped_capture_${imageCounter}.png\n`; 
      
      // Increment the counter for the next download
      imageCounter++;
      
    });

    // Initialize
    startCamera();
  </script>
</body>
</html>
